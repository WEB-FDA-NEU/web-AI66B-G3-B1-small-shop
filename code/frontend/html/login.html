<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YUMS - Login</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>

    <main class="login-page">

        <!-- Character -->
        <div class="character">

            <img src="../img/image_login/body.png"
                 class="character-body"
                 alt="YUMS character">

            <img src="../img/image_login/left_eye.png"
                 class="character-eye left-eye"
                 alt="">

            <img src="../img/image_login/right_eye.png"
                 class="character-eye right-eye"
                 alt="">

        </div>

        <!-- Login form -->
        <section class="login-card">

            <div class="brand">
                <h1>YUMS</h1>
                <p>You Manage your Shop</p>
            </div>

            <div class="login-title">
            </div>

            <form id="login-form">

                <div class="form-group">
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username">
                    <i class="fa-solid fa-envelope input-icon"></i>
                </div>

                <div class="form-group">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password">
                        <button type="button" class="password-toggle" id="password-toggle">
                            <i class="fa-solid fa-lock"></i>
                        </button>
                </div>

                <button type="submit" class="login-btn">
                    Login
                </button>

                <p class="register"> Don't have a account ?
                    <a href="#regiter">Register</a>
                </p>

            </form>

        </section>

    </main>

    <script src="../js/login.js"></script>

</body>
</html>
