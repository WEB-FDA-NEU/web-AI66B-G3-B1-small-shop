<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUMS - Change Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <div class="brand">
                <h1>YUMS</h1>
                <p>Change your temporary password</p>
            </div>
            <form class="login-form" id="changePasswordForm">
                <p class="users-password-note">Choose a new password with at least 8 characters before continuing.</p>
                <div class="form-group">
                    <input type="password" id="newPassword" name="newPassword" placeholder="New password" minlength="8" maxlength="72" autocomplete="new-password" required>
                </div>
                <div class="form-group">
                    <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm new password" minlength="8" maxlength="72" autocomplete="new-password" required>
                </div>
                <div class="regi-login">
                    <button type="submit" class="login-btn">Change password</button>
                    <p class="login-message" id="changePasswordMessage" role="alert" aria-live="polite"></p>
                </div>
            </form>
        </section>
    </main>
    <script src="../js/session.js?v=1"></script>
    <script src="../js/account_flows.js?v=1"></script>
</body>
</html>
