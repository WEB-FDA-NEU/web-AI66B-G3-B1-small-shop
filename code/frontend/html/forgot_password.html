<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUMS - Forgot Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card">
            <div class="brand">
                <h1>YUMS</h1>
                <p>Password reset request</p>
            </div>
            <form class="login-form" id="forgotPasswordForm">
                <div class="form-group">
                    <input type="text" id="username" name="username" placeholder="Username" maxlength="50" required>
                    <i class="fa-solid fa-user input-icon"></i>
                </div>
                <div class="regi-login">
                    <button type="submit" class="login-btn">Send request</button>
                    <p class="login-message" id="forgotPasswordMessage" role="status" aria-live="polite"></p>
                    <p class="register"><a href="index.html">Back to login</a></p>
                </div>
            </form>
        </section>
    </main>
    <script src="../js/session.js?v=1"></script>
    <script src="../js/account_flows.js?v=1"></script>
</body>
</html>
