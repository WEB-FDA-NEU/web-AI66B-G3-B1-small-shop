<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Create Order</title>
    <link rel="stylesheet" href="../css/order_create_edit.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda&display=swap" rel="stylesheet">
    <script src="../js/dishes_data.js" defer></script>
    <script src="../js/order_create_edit.js" defer></script>
</head>

<body>
    <div class="layout">
        <!--navigation zone-->
        <aside class="sidebar">
            <div class="logo-area">
                <h1>YUMS</h1>
                <p>YOU MANAGE YOUR SHOP</p>
            </div>
            <div class="sidebar-divider"></div>
            <nav class="sidebar-nav">
                <ul>
                    <li class="active">
                        <a href="order_create_edit.html">
                            <span class="nav-icon">🍽️</span>
                            <span>Orders</span>
                        </a>
                    </li>
                    <li>
                        <a href="customers.html">
                            <span class="nav-icon">👥</span>
                            <span>Customers</span>
                        </a>
                    </li>
                    <li>
                        <a href="inventory.html">
                            <span class="nav-icon">📦</span>
                            <span>Inventory</span>
                        </a>
                    </li>
                    <li>
                        <a href="employees.html">
                            <span class="nav-icon">👤</span>
                            <span>Employees</span>
                        </a>
                    </li>
                    <li>
                        <a href="sales.html">
                            <span class="nav-icon">📈</span>
                            <span>Sales</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <div class="sidebar-footer">
                © 2026 YUMS v1.0
            </div>
        </aside>

        <!--Main zone-->
        <main class="main-content">
            <!--page header-->
            <header class="page-header">
                <div class="page-heading">
                    <h1>Order Directory</h1>
                    <p>Create and manage orders</p>
                </div>
                <div class="account-card">
                    <div class="avatar">AD</div>
                    <div class="account-info">
                        <div class="role-name">Store Manager</div>
                        <div class="role-sub">ADMINISTRATOR</div>
                    </div>
                </div>
            </header>

            <!--switching button between new and check order-->
            <div class="order-tabs">
                <a class="tab-btn active" href="order_create_edit.html">New order</a>
                <a class="tab-btn" href="order_check.html">Check orders</a>
            </div>

            <!--menu part-->
            <div class="new-order-layout">
                <!--menu zone-->
                <section class="menu-zone">
                    <div class="menu-zone-header">
                        <div>
                            <h2>Menu</h2>
                            <p>Select dishes to add to the bill</p>
                        </div>
                    </div>
                    <div class="dish-grid" id="dishGrid"></div>
                </section>
                <!--bill zone-->
                <aside class="bill-zone">
                    <div class="bill-header">
                        <div>
                            <h2>Bill</h2>
                            <p>Selected dishes</p>
                        </div>
                        <div class="bill-search">
                            <input type="text" id="dishSearch" placeholder="Search dish name...">
                        </div>
                    </div>
                    <div class="bill-content">
                        <div class="bill-items" id="billItems"></div>
                        <div class="bill-footer">
                            <div class="bill-total">
                                <span>Total</span>
                                <strong id="billTotal">0VND</strong>
                            </div>
                            <button type="button" class="sum-btn" id="sumBtn">Sum</button>
                        </div>
                    </div>
                </aside>
            </div>
        </main>
    </div>
</body>
</html>
