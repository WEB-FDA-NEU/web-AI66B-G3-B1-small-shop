<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YUMS - Employee Management</title>
    
    <!-- Google Fonts: Bodoni Moda & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..900&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../css/employee.css">
</head>
<body>

    <!-- Sidebar Navigation -->
    <aside class="sidebar">
        <div>
            <div class="sidebar-brand">
                <h1>YUMS</h1>
                <p>You Manage your Shop</p>
            </div>
            
            <ul class="sidebar-menu">
                <li>
                    <a href="orders.html"><i class="fa-solid fa-receipt"></i> Orders</a>
                </li>
                <li>
                    <a href="customers.html"><i class="fa-solid fa-users"></i> Customers</a>
                </li>
                <li>
                    <a href="inventory.html"><i class="fa-solid fa-utensils"></i> Inventory</a>
                </li>
                <li class="active">
                    <a href="employees.html"><i class="fa-solid fa-id-badge"></i> Employees</a>
                </li>
                <li>
                    <a href="sales.html"><i class="fa-solid fa-chart-line"></i> Sales</a>
                </li>
            </ul>
        </div>

        <div class="sidebar-footer">
            <p>&copy; 2026 YUMS v1.0</p>
        </div>
    </aside>

    <!-- Main Content Area -->
    <main class="main-content">
        <header class="top-header">
            <div class="header-title">
                <h2>Employee Directory</h2>
                <p>Employee list</p>
            </div>

            <div class="user-profile">
                <div class="user-avatar">AD</div>
                <div class="user-info">
                    <div class="user-name">Store Manager</div>
                    <div class="user-role">Administrator</div>
                </div>
            </div>
        </header>

        <section class="action-bar">
            <div class="filter-group">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search by name or employee ID...">
                </div>

                <div class="filter-select">
                    <select id="roleFilter">
                        <option value="">All Positions</option>
                        <option value="Manager">Manager</option>
                        <option value="Cashier">Cashier</option>
                        <option value="Barista">Barista</option>
                        <option value="Server">Server</option>
                    </select>
                </div>
            </div>

            <button class="btn-add" id="openAddModalBtn">
                <i class="fa-solid fa-user-plus"></i> Add Employee
            </button>
        </section>

        <section class="table-wrapper">
            <table class="employee-table">
                <thead>
                    <tr>
                        <th>Employee ID</th>
                        <th>Name</th>
                        <th>Position</th>
                        <th>Shift</th>
                        <th>Phone Number</th>
                        <th>Hire Date</th>
                        <th>Status</th>
                        <th style="text-align: right;">Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                    <!-- Dynamic Rows populated via JS -->
                </tbody>
            </table>
        </section>
    </main>

    <!-- Add Employee Modal -->
    <div class="modal-overlay" id="employeeModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 id="modalTitle">Add New Employee</h3>
                <button type="button" class="modal-close" id="closeModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="employeeForm">
                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="fullName">Name *</label>
                            <input type="text" id="fullName" placeholder="e.g., John Doe" required>
                        </div>
                        <div class="form-group">
                            <label for="role">Position *</label>
                            <select id="role" required>
                                <option value="Server">Server</option>
                                <option value="Barista">Barista</option>
                                <option value="Cashier">Cashier</option>
                                <option value="Manager">Manager</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="shift">Shift *</label>
                            <select id="shift" required>
                                <option value="Morning (07:00 - 15:00)">Morning (07:00 - 15:00)</option>
                                <option value="Afternoon (15:00 - 23:00)">Afternoon (15:00 - 23:00)</option>
                                <option value="Full-time">Full-time</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number *</label>
                            <input type="tel" id="phone" placeholder="090x xxx xxx" required>
                        </div>
                        <div class="form-group">
                            <label for="status">Status</label>
                            <select id="status">
                                <option value="Active">Active</option>
                                <option value="On Leave">On Leave</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelModalBtn">Cancel</button>
                <button type="submit" form="employeeForm" class="btn-primary" id="saveEmployeeBtn">Save Information</button>
            </div>
        </div>
    </div>

    <!-- Edit Employee Modal -->
    <div class="modal-overlay" id="editEmployeeModal">
        <div class="modal-container">
            <div class="modal-header">
                <h3 class="modal-title">Edit Employee</h3>
                <button type="button" class="modal-close" id="closeEditModalBtn">&times;</button>
            </div>
            <div class="modal-body">
                <form id="editEmployeeForm">
                    <!-- Hidden input to track which employee is being edited -->
                    <input type="hidden" id="editEmployeeId">

                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label for="editFullName">Full Name *</label>
                            <input type="text" id="editFullName" required>
                        </div>

                        <div class="form-group">
                            <label for="editRole">Position *</label>
                            <select id="editRole" required>
                                <option value="Server">Server</option>
                                <option value="Barista">Barista</option>
                                <option value="Cashier">Cashier</option>
                                <option value="Manager">Manager</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="editShift">Shift *</label>
                            <select id="editShift" required>
                                <option value="Morning (07:00 - 15:00)">Morning (07:00 - 15:00)</option>
                                <option value="Afternoon (15:00 - 23:00)">Afternoon (15:00 - 23:00)</option>
                                <option value="Full-time">Full-time</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="editPhone">Phone Number *</label>
                            <input type="tel" id="editPhone" required>
                        </div>

                        <div class="form-group">
                            <label for="editStatus">Status</label>
                            <select id="editStatus">
                                <option value="Active">Active</option>
                                <option value="On Leave">On Leave</option>
                            </select>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-secondary" id="cancelEditBtn">Cancel</button>
                <button type="submit" form="editEmployeeForm" class="btn-primary">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toastNotification">System Notification</div>

    <!-- Custom Script -->
    <script src="../js/employee_script.js"></script>
</body>
</html>
